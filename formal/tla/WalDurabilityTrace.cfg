\* Used by formal/run-tlc.sh --trace. N comes from the trace module.
CONSTANTS
    N <- TraceN
    LazyMarkers = TRUE
    FirstWriteFix = TRUE
    ReportRule = "current"
INIT Init
NEXT Next
CHECK_DEADLOCK FALSE
INVARIANTS
    DurablePresentMatches
    DurableResolvedMatches
    RidingResolvedMatches
    RidingFloorMatches
    WrittenResolvedMatches
    ReportedMatches
    RestoreCommitMatches
    RestorePresentMatches
    TraceReportIsDurable
