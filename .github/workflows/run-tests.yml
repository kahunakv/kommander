name: Run Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  Kommander-Tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      GIT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Check out repository code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Check determinism boundary
        # A new direct wall-clock or thread-pool read in the consensus path makes a simulation
        # run unreplayable, and the failure is silent: the run still passes. Fail the build here
        # instead, before the run stops being reproducible.
        run: bash scripts/check-determinism-boundary.sh
      - name: Mount a small filesystem for the ENOSPC tests
        # The RocksDB storage-error latch under test is native state and needs a volume that really
        # runs out of space. A tmpfs with a small size AND a small inode count: on a block-full tmpfs
        # an empty file can still be created, and the latch needs file creation itself to fail.
        run: |
          sudo mkdir -p /mnt/kommander-enospc
          sudo mount -t tmpfs -o size=192m,nr_inodes=4096 tmpfs /mnt/kommander-enospc
          sudo chmod 1777 /mnt/kommander-enospc
          echo "KOMMANDER_ENOSPC_VOLUME=/mnt/kommander-enospc" >> "$GITHUB_ENV"
      - name: Run Tests
        # DSTRandom is the seeded random search. It belongs to a nightly budget, not to a pull
        # request: its cost grows with the seed count, and a seed that fails is a lead to
        # investigate rather than a verdict on the change under review. The DSTSmoke scenarios,
        # which include one short generated run, stay in this job.
        run: (cd Kommander.Tests && dotnet test -l "console;verbosity=detailed" --filter "Category!=Stress&Category!=DSTRandom" --blame-hang --blame-hang-timeout 120s)
